- name: BUILD K8S | Download latest HELM source code from GITHUB
  when: " inventory_hostname in groups['master'] "
  ansible.builtin.shell: cd /usr/local/ && git clone https://github.com/helm/helm.git && chown -Rf {{ ansible_user | default(lookup('env', 'USER')) }}:{{ ansible_user | default(lookup('env', 'USER')) }}  helm

- name: BUILD K8S | Build helm from source
  when: " inventory_hostname in groups['master'] "
  ansible.builtin.shell: export PATH=$PATH:/usr/local/go/bin/ && cd /usr/local/helm/ && make && make install && chown -R {{ ansible_user | default(lookup('env', 'USER')) }}:{{ ansible_user | default(lookup('env', 'USER')) }} /usr/local/helm
  register: build_helm

- name: DEBUG | Build Helm Output
  when: " inventory_hostname in groups['master'] "
  ansible.builtin.debug:
    var: build_helm
