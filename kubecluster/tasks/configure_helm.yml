---
- name: BUILD K8S | Download GO interpreter
  when: " inventory_hostname in groups['master'] "
  ansible.builtin.uri:
    url: https://go.dev/dl/go1.24.3.linux-amd64.tar.gz
    dest: /home/{{ ansible_user | default(lookup('env', 'USER')) }}
    owner: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    group: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    mode: 0644

- name: BUILD K8S | Extract GO interpereter
  when: " inventory_hostname in groups['master'] "
  ansible.builtin.shell: time tar -C /usr/local -xzvf /home/{{ ansible_user | default(lookup('env', 'USER')) }}/go1*.tar.gz
  register: extract_results
 
 
