apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-loadbalancer-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      run: web-loadbalancer-demo
  template:
    metadata:
      labels:
        run: web-loadbalancer-demo
    spec:
      containers:
      - name: web-loadbalancer-demo
        image: klimenta/serverip
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: LoadBalancer
  selector:
    run: web-loadbalancer-demo
